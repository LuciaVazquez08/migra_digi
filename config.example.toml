# Copiar como config.local.toml (no se versiona) y ajustar.
# Todas las claves son opcionales; los valores por defecto están en migracion_digicorp/config.py.

origen = 'E:\Raw Data'
destino = 'E:\Digicorp'
# Debe estar en el mismo volumen que el destino (E:) para publicar con un rename atómico.
trabajo = 'E:\Migracion Digicorp\trabajo'
excel_referencia = 'E:\Migracion Digicorp\Scripts\estructura_directorio.xlsx'
hoja_arbol = "Arbol_Carpetas"

# "simulacion" (por defecto) o "real". En "real" además hay que pasar --confirmar-ejecucion-real.
modo = "simulacion"
# Tope de clientes publicados por ejecución. Puede bajarse; nunca supera 2000.
limite_publicaciones = 2000

validar_digito_verificador = true
aceptar_imagen_descargada = true

dominios_permitidos = ["cdnva.s1gateway.com", "claro.my.salesforce.com"]
timeout_conexion = 15
timeout_lectura = 60
reintentos = 3
espera_reintento = 2
descargas_concurrentes = 4

# Enlaces públicos de Salesforce: se abren con un navegador automático (Playwright) sin ventana.
navegadores_simultaneos = 2
timeout_navegador = 60
navegador_visible = false        # true para ver el navegador trabajando
# navegador_canal = "msedge"     # usar el Edge instalado si no se puede instalar Chromium
# Si la red no deja a Python validar HTTPS (ERROR_DE_ENTORNO por certificado), descargar estos
# dominios con el navegador, que usa su propia red y certificados:
# dominios_via_navegador = ["cdnva.s1gateway.com"]

convertir_office = true
# soffice = 'C:\Program Files\LibreOffice\program\soffice.exe'
